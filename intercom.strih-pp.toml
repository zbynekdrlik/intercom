# strih-pp intercom hub routing (issue 1412, the Poprad rework).
# 11.10.2026: program only -- lv1 sends the program mix as the VBAN stream `strih`, the hub writes it to the
# `strih-program` PipeWire sink OBS captures (the strih-snv program path, issue 1344).
# 13.10.2026 (owner ROZHODNUTE: "prehod to"): the Poprad camera intercom moves here from VDO.Ninja, the
# SNV shape (intercom.strih-snv.toml) for the PP cameras cam1/4/6/7 + the phones (Janus) + the
# cutters. The PP router has no camN.lan names, so the cameras are their venue IPs (each cambox sends to
# strih.lan, which the PP router resolves to this box). The cutters' sound card is the Yamaha MG-XU USB
# card (2 in / 2 out, connected 13.10.2026), not the SNV MiniFuse 4: one stereo pair, so out 1/2 only.
# 13.10.2026 (issue 1424 part 3, owner: "mozme to tak spravit"): the vestibule TV (strih-pp HDMI-1 ->
# the Blackmagic HDMI-to-SDI converter) hears the lv1 program straight from this hub, no PipeWire and no
# OBS in between (zero latency; audio never behind the picture). The connector is named, the hub
# resolves it to its hw PCM by EDID vs ELD; nothing found = the leg stays silent and says why.
# 23.10.2026 (issue 1438): the hub opens the MG-XU itself through ALSA by its card ID `MGXU` (strih-pp
# /var/lib/alsa/asound.state; 2 channels each way), aplay for the cans and arecord for the talkback mic, no
# PipeWire node. A card that leaves USB is the leg DOWN, never a fallback: on 22.10.2026 the pw-cat legs
# re-routed into the `strih-program` sink while the MG-XU was unplugged. Rollback: adapter = "pipewire" with
# pipewire_target/source = "alsa_output/alsa_input.usb-Yamaha_Corporation_MG-XU-00.analog-stereo" and
# pipewire_channel_map = "FL,FR" -- since 24.10.2026 that rollback also needs PipeWire reinstalled first (the
# issue-1440 purge removed it; .claude/rules/strih-pipewire-purge.md "Rollback").
# 24.10.2026 (issue 1461): every ingress leg crosses its sender's clock with the hub's resampler and holds a
# FIXED target depth, `target_ms` rounded up to whole 256-frame blocks and read at start only: the cameras
# 16 ms (3 blocks), lv1 37.33 ms (7 blocks), the MG-XU capture 42.67 ms (8 blocks).
# 24.10.2026 (issue 1439 phase 2 on strih-pp, design 6385519443): the hub forwards nothing into OBS
# any more. lv1 sends the program as its own VBAN stream `strih-obs` to UDP 6981 straight into the
# OBS obs-vban source `ASIO zvuk` (scripts/strih-boxes/strih-pp.env), so the `program_out`
# participant (adapter pipewire, the `strih-program` sink OBS captured) and its two lv1 points are
# gone, and with them the last reason for PipeWire on this box (issue 1440). lv1's `strih` stream on
# 6980 fed the cans and the vestibule until 18.11.2026. Rollback: put the participant + the two
# points back from the previous version of this file and set the four STRIH_PROGRAM_* facts back to
# none.
# 18.11.2026 (intercom#32, the PP rig upgrade): lv1 stopped sending `strih` here; the hub's own
# Dante device (the [dlink] block below) carries dsg's stream master into the cans and the
# vestibule, lv1 is declared and routed nowhere.
# 29.10.2026 (issue 1431, a joint event): every camera cam1-7, so the strih behind strih.lan serves
# the SNV cameras too. A camera sits at the same 10.77.9.6N at both venues; that address is only the
# start-up return address, the hub sends each camN its mix to wherever camN's own stream comes from.
# Loaded through the daemon's own Matrix::from_toml by hub/tests/deployed_matrix_pp_1412.rs.

[hub]
bind = "0.0.0.0:8790"
vban_bind = "0.0.0.0:6980"
sample_rate = 48000
block_frames = 256

[janus]
api_url = "http://127.0.0.1:8088/janus"
room = 1000
room_secret_file = "/etc/intercom-hub/janus-room.secret"
rtp_bind = "0.0.0.0:6990"
codec = "opus"

[video]
ndi_source_name = "STRIH-PP (interkom)"
fps = 10
jpeg_quality = 70
enabled = true

# 18.11.2026 (intercom#32, owner: the PP rig upgrade, "PP on the SNV level"): the hub's own Dante
# device, the strih-snv shape. dsg (96 kHz) sends the stream master mix; since lv1 stopped sending
# (same day) it took all four lv1 points: the vestibule at unity, the cutters' cans at -8 dB like
# SNV's repro. Slot 2 (ARC 4442: RX 29928-29959), so it never shares strih-snv's
# slot 1 or strih-obs's slot 0; camera-box declares it in strih-pp's STRIH_DANTE_DEVICES (its peer
# message 18.11.2026; setup-strih step 13 opens the slot's ports).
[dlink]
name = "strih-pp-intercom"
iface = "enp5s0f1.70"
rx = ["STREAM L", "STREAM R"]
arc_port = 4442
cmc_port = 8802
flows_port = 4457
process_id = 1
network_rate = 96000
# intercom#46 (dstack#381, the owner's latency review of 21.11.2026): a stable margin (max arrival
# 2.14 ms, 0 late since 18.11), so P = the default 1 ms network latency + 3.5 ms = 4.5 ms (was the
# default 13.04 ms). Any late packet in dstack's next-day read puts it back.
receive_buffer_ms = 3.5

[[dlink.subscribe]]
rx = "STREAM L"
tx_channel = "STREAM master L"
tx_device = "dsg"

[[dlink.subscribe]]
rx = "STREAM R"
tx_channel = "STREAM master R"
tx_device = "dsg"

[[participant]]
name = "cam1"
role = "cambox"
adapter = "vban"
host = "10.77.9.61"
in_stream = "cam1"
out_stream = "cam1"
target_ms = 16.0
in_channels = 2
out_channels = 2

[[participant]]
name = "cam2"
role = "cambox"
adapter = "vban"
host = "10.77.9.62"
in_stream = "cam2"
out_stream = "cam2"
target_ms = 16.0
in_channels = 2
out_channels = 2

[[participant]]
name = "cam3"
role = "cambox"
adapter = "vban"
host = "10.77.9.63"
in_stream = "cam3"
out_stream = "cam3"
target_ms = 16.0
in_channels = 2
out_channels = 2

[[participant]]
name = "cam4"
role = "cambox"
adapter = "vban"
host = "10.77.9.64"
in_stream = "cam4"
out_stream = "cam4"
target_ms = 16.0
in_channels = 2
out_channels = 2

[[participant]]
