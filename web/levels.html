<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interkom — hlasitosti strihača</title>
  <link rel="stylesheet" href="/levels.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- intercom#34 + #38: the cutter's own mix of what plays in their headphones. One fader per
       source (FOH, LV1, Click, each camera, the phones) trims it on top of the hub's fixed routing
       (0 dB = the routing as shipped); the Master fader trims the whole output on top of them. A
       change takes effect at once and survives a hub restart. Served only on the notebook's
       loopback (http://127.0.0.1:8791/), never through the phone front. -->
  <header class="top">
    <h1>Hlasitosti v slúchadlách</h1>
    <span class="version" data-role="version">v{{VERSION}}</span>
  </header>

  <p class="status" data-role="status" data-state="loading" role="status" aria-live="polite">Načítavam…</p>

  <main class="board">
    <section class="strips" data-role="strips" aria-label="Mixér"></section>

    <section class="meter-wrap" aria-label="Výstup do slúchadiel">
      <div class="meter" data-role="meter" data-db="-120">
        <div class="meter-fill" data-role="meter-fill"></div>
      </div>
      <div class="meter-label">Výstup</div>
      <div class="meter-value" data-role="meter-value">— dB</div>
    </section>
  </main>

  <p class="hint">Každý zdroj má svoj posuvník, Master stíši alebo zosilní celý výstup. 0 dB = pôvodné nastavenie. Zmena platí hneď a ostane aj po reštarte.</p>

  <template id="strip-template">
    <div class="strip" data-role="strip">
      <div class="strip-db" data-role="db">0.0 dB</div>
      <input class="strip-slider" data-role="slider" type="range" step="0.5" />
      <div class="strip-label" data-role="label"></div>
      <button class="strip-mute" data-role="mute" type="button" aria-pressed="false">Stlmiť</button>
    </div>
  </template>

  <script src="/levels.js"></script>
</body>
</html>
