# The in-hub WebRTC phone leg E2E hub (intercom#42): the REAL intercom-hub with the phones
# participant on adapter "webrtc", on loopback ports. webrtc-hub.js fills the @...@ placeholders and
# starts and stops the binary (the spec kills and restarts it). A VBAN tone sent to stream "prog"
# reaches the phones bus; the phones' mics reach each other through the hub's phones-room and the
# cutters through the matrix. No Janus, no picture, no Dante device, no level sliders.

[hub]
bind = "127.0.0.1:@HTTP_PORT@"
vban_bind = "127.0.0.1:@VBAN_PORT@"
sample_rate = 48000
block_frames = 256

[webrtc]
udp_bind = "127.0.0.1:@UDP_PORT@"
max_phones = 4

[[participant]]
name = "prog"
role = "program_ref"
adapter = "vban"
in_stream = "prog"
in_channels = 1
out_channels = 0

[[participant]]
name = "phones"
role = "phones"
adapter = "webrtc"
in_channels = 2
out_channels = 2

[[participant]]
name = "cutters"
role = "cutters"
adapter = "none"
in_channels = 0
out_channels = 2

[[point]]
src = "prog"
in_ch = 1
dst = "phones"
out_ch = 1

[[point]]
src = "prog"
in_ch = 1
dst = "phones"
out_ch = 2

[[point]]
src = "phones"
in_ch = 1
dst = "cutters"
out_ch = 1

[[point]]
src = "phones"
in_ch = 2
dst = "cutters"
out_ch = 2
