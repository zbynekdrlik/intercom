# The level-sliders E2E hub (intercom#34, per source since intercom#38): a minimal routing on
# loopback ports shaped like strih-snv's cutters mix, one slider per source plus a master.
# start-levels-hub.js fills the @...@ placeholders (ports, the state file in a fresh scratch dir)
# and starts the real intercom-hub on the result. No VBAN leg sends anywhere (no participant has a
# VBAN output), no Janus, no picture, no Dante device.

[hub]
bind = "127.0.0.1:@HTTP_PORT@"
vban_bind = "127.0.0.1:@VBAN_PORT@"
control_bind = "127.0.0.1:@CONTROL_PORT@"
levels_file = "@LEVELS_FILE@"
sample_rate = 48000
block_frames = 256

[[participant]]
name = "prog"
role = "program_ref"
adapter = "vban"
in_stream = "prog"
in_channels = 3
out_channels = 0

[[participant]]
name = "lv1"
role = "program_ref"
adapter = "vban"
in_stream = "lv1"
in_channels = 2
out_channels = 0

