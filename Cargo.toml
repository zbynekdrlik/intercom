# The intercom workspace: the shared VBAN codec (`vban`, crate `intercom-vban`) and the mix-minus
# hub (`hub`, crate `intercom-hub`). Split from zbynekdrlik/camera-box on 2026-11-01 (airuleset#1280).
#
# ONE version for the whole repository. Every dev->main merge tags `vX.Y.Z` from this line, and that
# one tag pins both camera-box's `intercom-vban` git dependency and the hub release artifact
# (`intercom-hub-linux-amd64.tar.gz`). The release job refuses to publish a binary whose `--version`
# differs from the tag. 1.9.0 continues past the 1.8.x hubs camera-box deployed, so no box ever
# sees its hub version go down.
[workspace]
members = ["vban", "hub"]
resolver = "2"

[workspace.package]
version = "1.9.18"

# The dlink device's rate converter (dstack-resample -> rubato) runs on its real-time pump. Built
# unoptimised (cargo test, CI's llvm-cov) a 96 -> 48 kHz block took 2.3-3.3 ms against its 1.33 ms
# period: every block overran, the pump restarted its schedule and lost blocks (intercom#5,
# 4.11.2026). With rubato at opt-level 3 the same debug build reads 0 overruns, max 141 us. The
# release build is unaffected (it already reads 0 overruns, max 66 us).
# dstack-resample too, as dlink's crate docs ask ("Debug builds with a rate converter", v0.6.25).
[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.dstack-resample]
opt-level = 3

# The same release profile the hub was built with inside the camera-box workspace.
[profile.release]
lto = true
codegen-units = 1
strip = true
